# CI definition for agent-tool-gateway.
# NOTE: ship this file as docs/github-actions-ci.yml. It activates by
# moving it to .github/workflows/ci.yml (the push integration used for
# this repo cannot write under .github/workflows/ directly).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python examples/run_demo.py
